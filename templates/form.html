<!doctype html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Kontrola IBAN</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: vertical;
        }
        button {
            margin-top: 20px;
            width: 100%;
            background-color: #0078d4;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Overenie IBAN účtu</h1>
    <form action="/check" method="post">
        <label for="ibans">Zadaj jeden alebo viac IBAN-ov (každý na nový riadok):</label><br><br>
        <textarea name="ibans" id="ibans" required></textarea><br>
        <button type="submit">Skontrolovať</button>
    </form>
</div>
</body>
</html>
